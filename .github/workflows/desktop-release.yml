name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      acceptance_only:
        description: Run acceptance without publishing (retained candidates are diagnostic-only)
        required: false
        default: false
        type: boolean
      candidate_artifact_id:
        description: Diagnostic only; reuse retained installer ID with acceptance_only and its exact release_commit/tag
        required: false
        type: string
      release_tag:
        description: Version tag to publish after validation (existing tag, or supply exact commit)
        required: false
        type: string
      release_commit:
        description: Exact 40-character source SHA (retained mode pins candidate source; harness uses dispatched SHA)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  ORT_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  ACCEPTANCE_ONLY: ${{ inputs.acceptance_only && 'true' || 'false' }}
  CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
  RELEASE_COMMIT: ${{ inputs.release_commit }}
  RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYINSTALLER_CONFIG_DIR: D:\LearnNoteBuildCache\pyinstaller
      TMP: D:\LearnNoteBuildCache\temp
      TEMP: D:\LearnNoteBuildCache\temp
      SIGNING_CERT_BASE64: ${{ !inputs.candidate_artifact_id && secrets.WINDOWS_SIGNING_CERT_BASE64 || '' }}
      SIGNING_CERT_PASSWORD: ${{ !inputs.candidate_artifact_id && secrets.WINDOWS_SIGNING_CERT_PASSWORD || '' }}
      SIGNING_TIMESTAMP_URL: ${{ !inputs.candidate_artifact_id && secrets.WINDOWS_SIGNING_TIMESTAMP_URL || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_artifact_id && github.sha || inputs.release_commit || inputs.release_tag || github.ref }}
      - name: Validate release source
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid release tag" }
          $commit = git rev-parse HEAD
          if ($env:CANDIDATE_ARTIFACT_ID) {
            if ($env:ACCEPTANCE_ONLY -ne 'true' -or $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') { throw "Retained installers require acceptance-only manual diagnostics" }
            if ($env:CANDIDATE_ARTIFACT_ID -notmatch '^[1-9][0-9]*$' -or $env:RELEASE_COMMIT -notmatch '^[0-9a-f]{40}$' -or -not $env:RELEASE_TAG) { throw "Retained diagnostics require artifact ID and exact candidate source commit/tag" }
            if ($commit -ne $env:GITHUB_SHA) { throw "Diagnostic harness must match the dispatched workflow source" }
          } elseif ($env:RELEASE_COMMIT) {
            if ($env:RELEASE_COMMIT -notmatch '^[0-9a-f]{40}$' -or $env:RELEASE_COMMIT -ne $commit -or -not $env:RELEASE_TAG) { throw "Exact release commit and version tag are required" }
          } elseif ($env:RELEASE_TAG) {
            $expected = git rev-parse "$env:RELEASE_TAG^{commit}"
            if ($LASTEXITCODE -ne 0 -or $expected -ne $commit) { throw "Checkout does not match the requested release tag" }
          }
          $version = (Get-Content web/release-notes.json -Raw -Encoding UTF8 | ConvertFrom-Json).current
          if (-not $env:CANDIDATE_ARTIFACT_ID -and $env:RELEASE_TAG -and "v$version" -ne $env:RELEASE_TAG) { throw "Release tag does not match client version" }
          "BUILD_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.windows-py312.lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Install desktop dependencies
        if: env.CANDIDATE_ARTIFACT_ID == ''
        run: |
          python -m pip install -r backend/requirements.windows-py312.lock.txt
          if ($LASTEXITCODE -ne 0) { throw "Pinned Windows dependency installation failed" }
          python -c "import faster_whisper, ctranslate2, av, rapidocr_onnxruntime, webview"
          if ($LASTEXITCODE -ne 0) { throw "Desktop ASR/OCR runtime import failed" }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "Pinned installed-UI dependencies failed" }
          winget install --id JRSoftware.InnoSetup.7 -e --version 7.1.0 --scope machine --architecture x64 --source winget --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) { throw "Pinned Inno Setup installation failed" }
          $compiler = @(
            (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe"),
            (Join-Path ([Environment]::GetEnvironmentVariable("ProgramFiles(x86)")) "Inno Setup 7\ISCC.exe")
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) { throw "Pinned Inno Setup 7.1.0 compiler was not found" }
          "LEARNNOTE_ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify and restore retained diagnostic candidate
        if: env.CANDIDATE_ARTIFACT_ID != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/restore-installer-candidate.py --artifact-id "$env:CANDIDATE_ARTIFACT_ID" --source-commit "$env:RELEASE_COMMIT" --release-tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Retained candidate identity verification failed" }
      - name: Install retained diagnostic harness dependencies
        if: env.CANDIDATE_ARTIFACT_ID != ''
        shell: pwsh
        run: |
          python -m pip install requests==2.34.2 certifi==2026.7.22 charset-normalizer==3.5.2 idna==3.20 urllib3==2.8.0
          if ($LASTEXITCODE -ne 0) { throw "Installed harness dependency installation failed" }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "Pinned installed-UI dependencies failed" }
      - name: Check current retained diagnostic harness
        if: env.CANDIDATE_ARTIFACT_ID != ''
        shell: pwsh
        run: |
          python -m unittest scripts.tests.test_restore_installer_candidate scripts.tests.test_installed_release_workflow scripts.tests.test_installed_upgrade_acceptance.InstalledUpgradeTests
          if ($LASTEXITCODE -ne 0) { throw "Retained candidate and installed harness contracts failed" }
          node web/tests/installed_diagnostic_acceptance.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Current native diagnostic helper contracts failed" }
      - name: Provision pinned media tools for real fixture contracts
        if: env.CANDIDATE_ARTIFACT_ID == ''
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/install-visual-media-tools.ps1 -OutputDirectory build/release/visual-media-tools
      - name: Run release gate
        if: env.CANDIDATE_ARTIFACT_ID == ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/release | Out-Null
          python scripts/reliability-freshness.py --commit "$env:BUILD_COMMIT" --require-current-ref --output build/release/freshness.json
          if ($LASTEXITCODE -ne 0) { throw "Release source freshness failed" }
          python scripts/reliability-suite.py --output-dir build/release/reliability
          if ($LASTEXITCODE -ne 0) { throw "Commit-bound reliability gate failed" }
          $env:PYTHONPATH = "backend"
          python -m unittest discover backend/tests
          if ($LASTEXITCODE -ne 0) { throw "Backend release gate failed" }
          python -m unittest discover scripts/tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "Release script gate failed" }
          python -m unittest discover desktop/tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "Desktop release gate failed" }
          Get-ChildItem extension/tests/*.test.mjs | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { throw "Extension release gate failed" } }
          Get-ChildItem web/tests/*.test.mjs | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { throw "Web release gate failed" } }
      - name: Preserve reliability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-reliability-${{ github.run_id }}
          path: |
            build/release/freshness.json
            build/release/retained-candidate/*.json
            build/release/visual-media-tools/media-tools.json
            build/release/reliability/**/report.json
            build/release/reliability/*.log
          if-no-files-found: warn
      - name: Build portable desktop client
        if: env.CANDIDATE_ARTIFACT_ID == ''
        shell: pwsh
        run: |
          python scripts/generate-version-file.py build/learnnote-version.txt
          if ($LASTEXITCODE -ne 0) { throw "Release build or signing command failed" }
          pyinstaller --noconfirm --clean LearnNote.spec
          if ($LASTEXITCODE -ne 0) { throw "Release build or signing command failed" }
          @(
            "README.md",
            "LICENSE",
            "NOTICE",
            "THIRD_PARTY_NOTICES.md",
            "PRIVACY.md",
            "SECURITY.md",
            "SUPPORT.md"
          ) | ForEach-Object { Copy-Item $_ "dist/LearnNote/$_" }
          Copy-Item third_party dist/LearnNote/third_party -Recurse
          ./scripts/package-extension.ps1 -OutputPath build/LearnNote-Browser-Extension.zip
          Expand-Archive -LiteralPath build/LearnNote-Browser-Extension.zip -DestinationPath dist/LearnNote/extension -Force
          python scripts/audit-release-tree.py dist/LearnNote --output build/release-tree-audit.json
          if ($LASTEXITCODE -ne 0) { throw "Release build or signing command failed" }
      - name: Sign Windows executable
        if: env.CANDIDATE_ARTIFACT_ID == '' && env.SIGNING_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "learnnote-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          $timestamp = if ($env:SIGNING_TIMESTAMP_URL) { $env:SIGNING_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          & signtool sign /fd SHA256 /td SHA256 /tr $timestamp /f $certificate /p $env:SIGNING_CERT_PASSWORD dist/LearnNote/LearnNote.exe
          if ($LASTEXITCODE -ne 0) { throw "Release build or signing command failed" }
          & signtool verify /pa /v dist/LearnNote/LearnNote.exe
          if ($LASTEXITCODE -ne 0) { throw "Release build or signing command failed" }
          Remove-Item -LiteralPath $certificate -Force
      - name: Package Windows release
        if: env.CANDIDATE_ARTIFACT_ID == ''
        shell: pwsh
        run: |
          Compress-Archive -Path dist/LearnNote/* -DestinationPath LearnNote-Windows-x64.zip
          $version = (Get-Content web/release-notes.json -Raw -Encoding UTF8 | ConvertFrom-Json).current
          & $env:LEARNNOTE_ISCC "/DMyAppVersion=$version" scripts/learnnote-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Release build or signing command failed" }
          Copy-Item dist-installer/LearnNote-Setup-x64.exe LearnNote-Setup-x64.exe
      - name: Sign Windows installer
        if: env.CANDIDATE_ARTIFACT_ID == '' && env.SIGNING_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "learnnote-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          $timestamp = if ($env:SIGNING_TIMESTAMP_URL) { $env:SIGNING_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          & signtool sign /fd SHA256 /td SHA256 /tr $timestamp /f $certificate /p $env:SIGNING_CERT_PASSWORD LearnNote-Setup-x64.exe
          if ($LASTEXITCODE -ne 0) { throw "Release build or signing command failed" }
          & signtool verify /pa /v LearnNote-Setup-x64.exe
          if ($LASTEXITCODE -ne 0) { throw "Release build or signing command failed" }
          Remove-Item -LiteralPath $certificate -Force
      - name: Identify installer candidate before installed tests
        if: env.CANDIDATE_ARTIFACT_ID == ''
        shell: pwsh
        run: |
          $installer = Get-Item -LiteralPath LearnNote-Setup-x64.exe
          [ordered]@{
            schema_version = 1
            source_commit = $env:BUILD_COMMIT
            release_tag = $env:RELEASE_TAG
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            acceptance_status = "pending"
            installer_name = $installer.Name
            installer_bytes = $installer.Length
            installer_sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -LiteralPath build/release/installer-candidate.json -Encoding utf8
      - name: Retain installer candidate for failure diagnosis
        if: env.CANDIDATE_ARTIFACT_ID == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            LearnNote-Setup-x64.exe
            build/release/installer-candidate.json
            build/release/freshness.json
            build/release-tree-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Smoke-test installed release
        shell: pwsh
        run: ./scripts/test-release-installer.ps1 -InstallerPath LearnNote-Setup-x64.exe
      - name: Smoke-test upgrade from previous release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = $env:RELEASE_TAG
          $previous = gh release list --repo "${{ github.repository }}" --limit 20 --json tagName,isDraft,isPrerelease,publishedAt |
            ConvertFrom-Json |
            Where-Object { -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -ne $currentTag } |
            Sort-Object publishedAt -Descending |
            Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "Previous stable release lookup failed" }
          if (-not $previous) { throw "Previous stable release is required for installed upgrade acceptance" }
          if ($currentTag -eq 'v0.2.16' -and $previous.tagName -ne 'v0.2.15') { throw "0.2.16 acceptance requires the immutable 0.2.15 installer" }
          $previousDir = Join-Path $env:RUNNER_TEMP "previous-release"
          New-Item -ItemType Directory -Path $previousDir -Force | Out-Null
          gh release download $previous.tagName `
            --repo "${{ github.repository }}" `
            --pattern "LearnNote-Setup-x64.exe" `
            --dir $previousDir
          if ($LASTEXITCODE -ne 0) { throw "Previous stable installer download failed" }
          $previousMetadata = gh api "repos/${{ github.repository }}/releases/tags/$($previous.tagName)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Previous stable release metadata failed" }
          $previousAssets = @($previousMetadata.assets | Where-Object { $_.name -eq "LearnNote-Setup-x64.exe" })
          if ($previousAssets.Count -ne 1 -or $previousAssets[0].digest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Previous installer has no unique SHA256 identity" }
          $previousInstaller = Join-Path $previousDir "LearnNote-Setup-x64.exe"
          $previousHash = (Get-FileHash -LiteralPath $previousInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ("sha256:$previousHash" -ne $previousAssets[0].digest) { throw "Previous installer digest mismatch" }
          $env:GH_TOKEN = ""
          ./scripts/test-upgrade-installer.ps1 `
            -PreviousInstallerPath $previousInstaller `
            -CurrentInstallerPath "$PWD/LearnNote-Setup-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw "Cover-upgrade smoke failed" }
          python scripts/installed-upgrade-acceptance.py `
            --previous-installer "$previousInstaller" `
            --current-installer "$PWD/LearnNote-Setup-x64.exe" `
            --expected-previous-version "$($previous.tagName.TrimStart('v'))" `
            --expected-current-version "$($currentTag.TrimStart('v'))" `
            --output-dir build/release/installed-upgrade
          if ($LASTEXITCODE -ne 0) { throw "Installed diagnostic and saved-subtitle acceptance failed" }
      - name: Retain installed upgrade acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-upgrade-${{ github.run_id }}
          path: |
            build/release/installed-upgrade/*.json
            build/release/installed-upgrade/*.log
            build/release/installed-upgrade/*.png
          if-no-files-found: warn
      - name: Package browser extension
        if: env.CANDIDATE_ARTIFACT_ID == ''
        shell: pwsh
        run: |
          $manifest = Get-Content extension/manifest.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $clientVersion = (Get-Content web/release-notes.json -Raw -Encoding UTF8 | ConvertFrom-Json).current
          if ($env:RELEASE_TAG -and "v$clientVersion" -ne $env:RELEASE_TAG) {
            throw "Requested tag does not match client version v$clientVersion."
          }
          $extensionAsset = "LearnNote-Browser-Extension-v$($manifest.version).zip"
          ./scripts/package-extension.ps1 -OutputPath "$PWD/$extensionAsset"
          python scripts/build-provenance.py
          if ($LASTEXITCODE -ne 0) { throw "Build inventory failed" }
          $assets = @("LearnNote-Windows-x64.zip", "LearnNote-Setup-x64.exe", $extensionAsset, "LearnNote-SBOM.json", "LearnNote-Build-Source.json", "LearnNote-Resolved-Requirements.txt")
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          $lines | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii
      - name: Attest release build provenance
        if: env.RELEASE_TAG != '' && env.ACCEPTANCE_ONLY != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.CANDIDATE_ARTIFACT_ID == ''
        with:
          name: LearnNote-release-assets
          path: |
            LearnNote-Windows-x64.zip
            LearnNote-Setup-x64.exe
            LearnNote-Browser-Extension-v*.zip
            SHA256SUMS.txt
            LearnNote-SBOM.json
            LearnNote-Build-Source.json
            LearnNote-Resolved-Requirements.txt
            build/release/freshness.json
            build/release/reliability/**/report.json
            build/release/reliability/*.log
      - name: Publish GitHub Release
        if: env.RELEASE_TAG != '' && env.ACCEPTANCE_ONLY != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:ACCEPTANCE_ONLY -eq 'true') { throw "Acceptance-only runs cannot create tags or publish releases" }
          $extensionAsset = Get-ChildItem -LiteralPath . -Filter "LearnNote-Browser-Extension-v*.zip" |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $extensionAsset) {
            throw "Versioned browser extension asset was not found."
          }
          python scripts/ensure-release-tag.py --tag "$env:RELEASE_TAG" --commit "$env:BUILD_COMMIT" --repository "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "Release tag identity verification failed; nothing was published" }
          ./scripts/publish-release.ps1 -Tag "$env:RELEASE_TAG" -Repository "${{ github.repository }}"
