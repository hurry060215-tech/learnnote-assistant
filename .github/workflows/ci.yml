name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints*.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.windows-py312.lock.txt -r backend/requirements.test.txt
          if ($LASTEXITCODE -ne 0) { throw "Pinned dependency installation failed" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Dependency consistency check failed" }
      - name: Python checks
        env:
          PYTHONPATH: backend
        run: |
          python -m compileall backend/app
          if ($LASTEXITCODE -ne 0) { throw "Python compilation failed" }
          python scripts/check-architecture.py
          if ($LASTEXITCODE -ne 0) { throw "Architecture checks failed" }
          python scripts/check-workflow-shells.py
          if ($LASTEXITCODE -ne 0) { throw "Workflow shell checks failed" }
          python scripts/audit-i18n.py
          if ($LASTEXITCODE -ne 0) { throw "Localization contract failed" }
          python -m unittest discover backend/tests
          if ($LASTEXITCODE -ne 0) { throw "Backend tests failed" }
          python scripts/evidence-quality-benchmark.py
          if ($LASTEXITCODE -ne 0) { throw "Grounding rule smoke benchmark failed" }
          python scripts/claim-evidence-benchmark.py
          if ($LASTEXITCODE -ne 0) { throw "Public claim evidence benchmark failed" }
      - name: Extension and web checks
        shell: pwsh
        run: |
          @("extension/background.js", "extension/content.js", "extension/page_hook.js", "extension/sidepanel.js", "web/app.js") | ForEach-Object {
            node --check $_
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $_" }
          }
          Get-ChildItem extension/tests/*.test.mjs | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { throw "Extension test failed: $($_.Name)" } }
          Get-ChildItem web/tests/*.test.mjs | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { throw "Web test failed: $($_.Name)" } }
      - name: Desktop and release checks
        run: |
          python -m unittest discover scripts/tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "Script tests failed" }
          python -m unittest desktop.tests.test_desktop_launcher
          if ($LASTEXITCODE -ne 0) { throw "Desktop tests failed" }
      - name: Release packaging smoke
        shell: pwsh
        run: |
          ./scripts/package-extension.ps1 -OutputPath "$env:RUNNER_TEMP/LearnNote-Browser-Extension.zip"
          if (-not (Test-Path "$env:RUNNER_TEMP/LearnNote-Browser-Extension.zip")) {
            throw "Extension package was not created."
          }
          $manifestVersion = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          python scripts/validate-store-package.py "$env:RUNNER_TEMP/LearnNote-Browser-Extension.zip" --version $manifestVersion

  portable-asr:
    name: Portable ASR regression (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      LEARNNOTE_DATA_DIR: ${{ runner.temp }}/learnnote-ci
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints*.txt
      - name: Install constrained backend and optional ASR
        # Use the shared runtime pins as constraints, not Windows-only packages.
        run: |
          python -m pip install -r backend/requirements.test.txt -r backend/requirements.asr.txt -c backend/requirements.windows-py312.lock.txt -c backend/constraints.linux-py312.txt
          python -m pip check
      - name: Require the real audio decoder
        # Fail before optional tests can skip an absent ASR runtime. No model load.
        run: python -c "import av; from faster_whisper.audio import decode_audio; print('PyAV', av.__version__)"
      - name: Decode generated audio and run portable regressions
        run: |
          python -m unittest backend.tests.test_cloud_qa_regressions
          python -m unittest backend.tests.test_migrations backend.tests.test_integrations backend.tests.test_knowledge
