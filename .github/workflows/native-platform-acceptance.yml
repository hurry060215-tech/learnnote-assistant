name: Native platform acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - LearnNote.macos.spec
      - desktop/**
      - scripts/native-platform-acceptance.py
      - scripts/native-migration-quit.swift
      - scripts/native-version-window.swift
      - scripts/tests/test_native_platform_acceptance.py
      - .github/workflows/native-platform-acceptance.yml

permissions:
  contents: read

jobs:
  native-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ORT_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.test.txt
      - run: python -m pip install -r backend/requirements.test.txt
      - name: Build unsigned native macOS app
        if: runner.os == 'macOS'
        run: |
          python -m pip install pyinstaller==6.22.2 pyinstaller-hooks-contrib==2026.7
          pyinstaller --noconfirm --clean LearnNote.macos.spec
      - name: Exercise native macOS window and packaged migration restart
        if: runner.os == 'macOS'
        run: python scripts/native-platform-acceptance.py --app dist/LearnNote.app --migration-smoke --output build/native-acceptance
      - name: Exercise Linux source backend
        if: runner.os == 'Linux'
        run: python scripts/native-platform-acceptance.py --output build/native-acceptance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-acceptance-${{ runner.os }}-${{ github.run_id }}
          path: |
            build/native-acceptance/
            !build/native-acceptance/capture-home/**
            !build/native-acceptance/migration-smoke/*-home/**
          if-no-files-found: warn
          retention-days: 14
      - name: Retain scoped synthetic migration state including hidden files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'macOS'
        with:
          name: native-migration-state-${{ runner.os }}-${{ github.run_id }}
          path: |
            build/native-acceptance/migration-smoke/source/
            build/native-acceptance/migration-smoke/destination/
            build/native-acceptance/migration-smoke/app-root/
            build/native-acceptance/migration-smoke/.learnnote-migration-*/
            build/native-acceptance/migration-smoke/previous-config.bin
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
