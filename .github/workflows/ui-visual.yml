name: UI visual acceptance

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "web/**"
      - "site/**"
      - "scripts/site-visual-acceptance.cjs"
      - "extension/**"
      - "backend/app/**"
      - "backend/requirements*.txt"
      - "backend/constraints*.txt"
      - "scripts/*visual*.cjs"
      - "scripts/assistant-runs-fixture.py"
      - "scripts/local-player-fixture.py"
      - "scripts/material-batch-acceptance.cjs"
      - "scripts/material-catalog-recovery-acceptance.cjs"
      - "scripts/progressive-sections-acceptance.cjs"
      - "scripts/sidepanel-progressive-acceptance.cjs"
      - "scripts/e2e-extension-smoke.py"
      - "scripts/serve-samples.py"
      - "scripts/section-review-*"
      - "scripts/personal-anchors-*"
      - "scripts/personal-review-acceptance.cjs"
      - "scripts/course-question-acceptance.cjs"
      - "scripts/course-upgrade-*"
      - "scripts/course-concepts-acceptance.cjs"
      - "scripts/cited-relations-acceptance.cjs"
      - ".github/workflows/ui-visual.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "web/**"
      - "site/**"
      - "scripts/site-visual-acceptance.cjs"
      - "extension/**"
      - "backend/requirements*.txt"
      - "backend/constraints*.txt"
      - "scripts/*visual*.cjs"
      - "scripts/assistant-runs-fixture.py"
      - "scripts/local-player-fixture.py"
      - "scripts/material-batch-acceptance.cjs"
      - "scripts/material-catalog-recovery-acceptance.cjs"
      - "scripts/progressive-sections-acceptance.cjs"
      - "scripts/sidepanel-progressive-acceptance.cjs"
      - "scripts/e2e-extension-smoke.py"
      - "scripts/serve-samples.py"
      - "scripts/section-review-*"
      - "scripts/personal-anchors-*"
      - "scripts/personal-review-acceptance.cjs"
      - "scripts/course-question-acceptance.cjs"
      - "scripts/course-upgrade-*"
      - "scripts/course-concepts-acceptance.cjs"
      - "scripts/cited-relations-acceptance.cjs"
      - ".github/workflows/ui-visual.yml"

permissions:
  contents: read

jobs:
  accessibility-visual:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install visual test dependencies
        id: visual_dependencies
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.test.txt -c backend/requirements.windows-py312.lock.txt
          if ($LASTEXITCODE -ne 0) { throw "Constrained visual dependency installation failed" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Visual dependency consistency check failed" }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "Visual JavaScript dependency installation failed" }
      - name: Course upgrade stale-response acceptance with actual Edge
        shell: pwsh
        run: |
          node scripts/course-upgrade-acceptance.cjs http://127.0.0.1:18940 build/course-upgrade-synthetic-ui
          if ($LASTEXITCODE -ne 0) { throw "Course upgrade stale-response frontend gate failed" }
      - name: Course episode retry and upgrade with actual Edge and isolated API
        if: ${{ !cancelled() && steps.visual_dependencies.outcome == 'success' }}
        shell: pwsh
        run: |
          node scripts/course-upgrade-api-acceptance.cjs build/course-upgrade-ui
          if ($LASTEXITCODE -ne 0) { throw "Course episode upgrade real API/Edge gate failed" }
      - name: Start isolated local backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/ui-visual-data | Out-Null
          $env:PYTHONPATH = "backend"
          $env:LEARNNOTE_DATA_DIR = "$PWD/build/ui-visual-data"
          $server = Start-Process -FilePath python -ArgumentList @("-m", "uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8765") -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/health
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "Local backend did not become ready." }
            node scripts/global-assistant-acceptance.cjs http://127.0.0.1:8765 build/global-ui
            if ($LASTEXITCODE -ne 0) { throw "Global assistant and navigation gate failed" }
            node scripts/assistant-operations-visual-acceptance.cjs http://127.0.0.1:8765 build/assistant-operations-ui
            if ($LASTEXITCODE -ne 0) { throw "Native assistant operations and undo gate failed" }
            node scripts/assistant-runs-visual-acceptance.cjs build/assistant-runs-ui
            if ($LASTEXITCODE -ne 0) { throw "Bounded assistant workflow Edge/API/disk gate failed" }
            node scripts/personal-review-acceptance.cjs build/personal-review-ui
            if ($LASTEXITCODE -ne 0) { throw "Personal whole-note review Edge/API/disk gate failed" }
            node scripts/section-review-acceptance.cjs build/section-review-ui
            if ($LASTEXITCODE -ne 0) { throw "Chapter review consent and Edge/API/disk gate failed" }
            node scripts/assistant-controls-visual-acceptance.cjs build/assistant-controls-ui
            if ($LASTEXITCODE -ne 0) { throw "Native task/course controls Edge/API/SDK/disk gate failed" }
            node scripts/chat-stream-acceptance.cjs http://127.0.0.1:8765 build/chat-stream-ui
            if ($LASTEXITCODE -ne 0) { throw "Streaming assistant gate failed" }
            node scripts/layout-visual-acceptance.cjs http://127.0.0.1:8765 build/layout-ui
            if ($LASTEXITCODE -ne 0) { throw "Video layout and panel resize gate failed" }
            node scripts/reader-workflow-acceptance.cjs http://127.0.0.1:8765 build/reader-ui
            if ($LASTEXITCODE -ne 0) { throw "Reader timeline and navigation gate failed" }
            node scripts/progressive-sections-acceptance.cjs http://127.0.0.1:8765 build/progressive-sections-ui
            if ($LASTEXITCODE -ne 0) { throw "Progressive generated-section reader gate failed" }
            node scripts/material-batch-acceptance.cjs http://127.0.0.1:8765 build/material-batch-ui
            if ($LASTEXITCODE -ne 0) { throw "Local material batch import gate failed" }
            node scripts/workspace-ux-acceptance.cjs http://127.0.0.1:8765 build/workspace-ux
            if ($LASTEXITCODE -ne 0) { throw "Workspace settings and assistant continuity gate failed" }
            node scripts/ui-readability-acceptance.cjs http://127.0.0.1:8765 build/readability-ui
            if ($LASTEXITCODE -ne 0) { throw "Reading typography and navigation gate failed" }
            node scripts/note-controls-visual-acceptance.cjs http://127.0.0.1:8765 build/note-controls-ui
            if ($LASTEXITCODE -ne 0) { throw "TOC controls and summary editing gate failed" }
            node scripts/sidepanel-progressive-acceptance.cjs build/sidepanel-progressive-ui
            if ($LASTEXITCODE -ne 0) { throw "Sidepanel progressive reading gate failed" }
            node scripts/captions-panel-acceptance.cjs
            if ($LASTEXITCODE -ne 0) { throw "Caption fast-path panel gate failed" }
            node scripts/model-catalog-acceptance.cjs http://127.0.0.1:8765
            if ($LASTEXITCODE -ne 0) { throw "Model catalog and vision controls gate failed" }
            node scripts/model-route-visual-acceptance.cjs http://127.0.0.1:8765 build/model-route-ui
            if ($LASTEXITCODE -ne 0) { throw "Model route disclosure and offline readiness gate failed" }
            node scripts/workspace-recovery-acceptance.cjs http://127.0.0.1:8765 build/workspace-recovery
            if ($LASTEXITCODE -ne 0) { throw "Draft, history and connection recovery gate failed" }
            node scripts/core-output-acceptance.cjs http://127.0.0.1:8765 build/core-output
            if ($LASTEXITCODE -ne 0) { throw "Profile, optional models and subtitle navigation gate failed" }
            node scripts/update-center-acceptance.cjs http://127.0.0.1:8765
            if ($LASTEXITCODE -ne 0) { throw "Update controls and unsaved editing guard failed" }
            node scripts/product-workspace-acceptance.cjs http://127.0.0.1:8765 build/product-ui
            if ($LASTEXITCODE -ne 0) { throw "Product workspace gate failed" }
            node scripts/unified-workspace-acceptance.cjs http://127.0.0.1:8765 build/unified-ui
            if ($LASTEXITCODE -ne 0) { throw "Unified workspace gate failed" }
            node scripts/redesign-acceptance.cjs http://127.0.0.1:8765 build/redesign-ui
            if ($LASTEXITCODE -ne 0) { throw "Redesign interaction gate failed" }
            node scripts/accessibility-visual-acceptance.cjs http://127.0.0.1:8765/web/classic.html build/ui-visual
            if ($LASTEXITCODE -ne 0) { throw "Accessibility visual gate failed" }
            node scripts/learning-workflow-acceptance.cjs http://127.0.0.1:8765/web/classic.html build/learning-ui
            if ($LASTEXITCODE -ne 0) { throw "Learning interaction gate failed" }
            node scripts/encoding-redecode-acceptance.cjs http://127.0.0.1:8765/web/classic.html build/encoding-redecode-ui
            if ($LASTEXITCODE -ne 0) { throw "Existing material re-decode gate failed" }
            node scripts/extension-locale-visual-acceptance.cjs build/extension-locales
            if ($LASTEXITCODE -ne 0) { throw "Extension locale/layout matrix failed" }
            node scripts/study-product-visual-acceptance.cjs http://127.0.0.1:8765 build/study-product-ui
            if ($LASTEXITCODE -ne 0) { throw "Default reader/studio accessibility matrix failed" }
            node scripts/local-player-visual-acceptance.cjs build/local-player-ui
            if ($LASTEXITCODE -ne 0) { throw "Local player range, seek and source identity gate failed" }
            node scripts/evidence-source-acceptance.cjs http://127.0.0.1:8765 build/evidence-source-ui
            if ($LASTEXITCODE -ne 0) { throw "Evidence source and frame navigation failed" }
            node scripts/source-review-visual-acceptance.cjs http://127.0.0.1:8765 build/source-review-ui
            if ($LASTEXITCODE -ne 0) { throw "Source review presentation and export navigation failed" }
            node scripts/screen-subtitle-visual-acceptance.cjs http://127.0.0.1:8765 build/screen-subtitle-ui
            if ($LASTEXITCODE -ne 0) { throw "Screen subtitle preview and resume controls failed" }
            node scripts/course-question-acceptance.cjs http://127.0.0.1:8765 build/course-question-ui
            if ($LASTEXITCODE -ne 0) { throw "Course question scope and navigation failed" }
            node scripts/pdf-ocr-acceptance.cjs http://127.0.0.1:8765 build/pdf-ocr-ui
            if ($LASTEXITCODE -ne 0) { throw "Scanned PDF OCR confidence and recovery failed" }
            node scripts/task-stream-reconnect-acceptance.cjs build/task-stream-reconnect-ui
            if ($LASTEXITCODE -ne 0) { throw "Task stream reconnect gate failed" }
            node scripts/design-visual-acceptance.cjs http://127.0.0.1:8765 build/design-ui
            if ($LASTEXITCODE -ne 0) { throw "Design alignment and responsive visual gate failed" }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Personal annotations with actual Edge and backend
        shell: pwsh
        run: |
          python scripts/personal-anchors-fixture.py
          if ($LASTEXITCODE -ne 0) { throw "Personal annotation fixture failed" }
          $env:PYTHONPATH = "backend"
          $env:LEARNNOTE_DATA_DIR = "$PWD/build/personal-anchors-acceptance/data"
          $env:ORT_DISABLE_TELEMETRY = "1"
          $env:HF_HUB_DISABLE_TELEMETRY = "1"
          $server = Start-Process -FilePath python -ArgumentList @("-m", "uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8766") -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8766/health
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "Personal annotation backend did not become ready" }
            node scripts/personal-anchors-acceptance.cjs http://127.0.0.1:8766
            if ($LASTEXITCODE -ne 0) { throw "Personal annotation Edge/backend gate failed" }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Material catalog recovery with actual Edge and synthetic responses
        shell: pwsh
        run: |
          node scripts/material-catalog-recovery-acceptance.cjs http://127.0.0.1:18932 build/material-catalog-recovery-ui
          if ($LASTEXITCODE -ne 0) { throw "Material catalog recovery Edge gate failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-visual-${{ github.run_id }}
          path: |
            build/design-ui
            build/global-ui
            build/assistant-operations-ui
            build/assistant-runs-ui
            build/personal-review-ui
            build/section-review-ui
            build/assistant-controls-ui
            build/chat-stream-ui
            build/layout-ui
            build/workspace-ux
            build/readability-ui
            build/note-controls-ui
            build/captions-panel
            build/model-catalog
            build/workspace-recovery
            build/core-output
            build/reader-ui
            build/progressive-sections-ui
            build/sidepanel-progressive-ui
            build/material-batch-ui
            build/material-catalog-recovery-ui
            build/product-ui
            build/unified-ui
            build/redesign-ui
            build/ui-visual
            build/learning-ui
            build/encoding-redecode-ui
            build/pdf-ocr-ui
            build/task-stream-reconnect-ui
            build/extension-locales
            build/study-product-ui
            build/local-player-ui
            build/evidence-source-ui
            build/source-review-ui
            build/screen-subtitle-ui
            build/personal-anchors-acceptance/report.json
            build/personal-anchors-acceptance/personal-anchors.png
            build/personal-anchors-acceptance/learning-restore-blocked.png
            build/personal-anchors-acceptance/learning-backup-error-mobile.png
            build/course-question-ui
            build/course-upgrade-synthetic-ui
            build/course-upgrade-ui
            build/model-route-ui
          if-no-files-found: warn
          retention-days: 14

  extension-runtime:
    name: Real Edge extension smoke (synthetic local media)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      LEARNNOTE_DATA_DIR: ${{ github.workspace }}/build/extension-smoke-data
      ORT_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints*.txt
      - name: Install constrained local fixture dependencies
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.test.txt -c backend/requirements.windows-py312.lock.txt
          if ($LASTEXITCODE -ne 0) { throw "Extension smoke dependency installation failed" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Extension smoke dependency consistency failed" }
      - name: Exercise the real unpacked extension in a fresh Edge profile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/extension-smoke | Out-Null
          python scripts/e2e-extension-smoke.py --browser edge --backend-port 0 --samples-port 0 --debug-port 0 2>&1 | Tee-Object build/extension-smoke/run.log
          $smokeExit = $LASTEXITCODE
          @{
            commit = $env:GITHUB_SHA
            browser = "Edge"
            extension_source = "unpacked checkout"
            data = "synthetic local fixtures only"
            exit_code = $smokeExit
            scope = "heartbeat, content injection, MP4/HLS, POST request, iframe/cookie context, Side Panel handoff, real timestamp seek and stale-source rejection"
            excluded = "real accounts, native optional-permission prompt, store install or upgrade, long-task recovery"
          } | ConvertTo-Json | Set-Content -Encoding UTF8 build/extension-smoke/report.json
          if ($smokeExit -ne 0) { throw "Real Edge extension smoke failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: extension-runtime-${{ github.run_id }}
          path: |
            build/extension-smoke
            build/extension-smoke-data/test-runs/e2e-logs
          if-no-files-found: warn
          retention-days: 14

  public-site:
    name: Public website visual acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Test existing website with Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m http.server 8793 --directory site --bind 127.0.0.1 > /tmp/learnnote-site.log 2>&1 &
          node scripts/site-visual-acceptance.cjs http://127.0.0.1:8793 build/site-ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-site-${{ github.run_id }}
          path: build/site-ui
          if-no-files-found: warn
          retention-days: 14
