name: Native macOS version rollback gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-rollback:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ORT_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out the acceptance harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out immutable v0.2.14 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 5a1db274f68df792149658ff2bb27894870eb608
          path: sources/old
          fetch-depth: 0
          persist-credentials: false
      - name: Check out immutable v0.2.15 candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ee32db1e1c78bbe46c7a5aaa444d4f990383c3d1
          path: sources/new
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Prepare isolated immutable app builds and provenance
        run: |
          python scripts/native-version-rollback-build.py \
            --old-source sources/old \
            --new-source sources/new \
            --environments .rollback-build-envs \
            --output build/version-rollback
      - name: Exercise old to new to old native app sequence
        run: |
          .rollback-build-envs/new/bin/python scripts/native-version-rollback.py \
            --old-app sources/old/dist/LearnNote.app \
            --new-app sources/new/dist/LearnNote.app \
            --output build/version-rollback \
            --build-manifest build/version-rollback/build-manifest.json
      - name: Preserve rollback snapshots, native captures and build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-macos-version-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/version-rollback/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
