name: Obsidian plugin

on:
  push:
    branches: [main]
    paths:
      - "integrations/obsidian-learnnote/**"
      - ".github/workflows/obsidian-plugin.yml"
  pull_request:
    paths:
      - "integrations/obsidian-learnnote/**"
      - ".github/workflows/obsidian-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/obsidian-learnnote
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/obsidian-learnnote/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: git diff --exit-code -- main.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: learnnote-obsidian
          path: |
            integrations/obsidian-learnnote/main.js
            integrations/obsidian-learnnote/manifest.json
            integrations/obsidian-learnnote/styles.css
            integrations/obsidian-learnnote/README.md
