name: Reliability gates

on:
  schedule:
    - cron: "23 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-reliability:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.test.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.test.txt
      - name: Release hardening contracts
        run: python -m unittest discover scripts/tests -p "test_release_hardening.py"
      - name: Offline model-provider contract
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/reliability | Out-Null
          python scripts/model-provider-contract.py --json-output build/reliability/model-provider-contract.json
      - name: Synthetic 60-minute media and frame gate
        run: >
          python scripts/long-video-reliability.py
          --output-dir "build/reliability/long-video"
          --memory-budget-mb 512
          --min-free-disk-mb 512
          --keep-artifacts
      - name: Synthetic 30/60/180-minute resource matrix
        shell: pwsh
        run: |
          $durations = @(30, 60, 180)
          foreach ($duration in $durations) {
            $target = "build/reliability/long-video-matrix/$duration"
            $interval = [Math]::Max(15, [Math]::Floor($duration / 6))
            python scripts/long-video-reliability.py `
              --duration-seconds $duration `
              --frame-interval $interval `
              --max-frames 40 `
              --memory-budget-mb 512 `
              --min-free-disk-mb 512 `
              --output-dir $target `
              --keep-artifacts
            if ($LASTEXITCODE -ne 0) { throw "Long-video matrix failed at ${duration}s" }
      - name: Real local-task cancellation gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/reliability/cancel | Out-Null
          python scripts/cancel-reliability.py `
            --duration-seconds 180 `
            --output-dir build/reliability/cancel
      - name: Complete local 60-minute task gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/reliability/full-local-task | Out-Null
          python scripts/full-local-task-reliability.py `
            --duration-seconds 3600 `
            --output-dir build/reliability/full-local-task
          }
      - name: Upload offline reliability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-reliability-${{ github.run_id }}
          path: |
            build/reliability/model-provider-contract.json
            build/reliability/long-video/report.json
            build/reliability/long-video-matrix/**/report.json
            build/reliability/cancel/report.json
            build/reliability/full-local-task/report.json
          if-no-files-found: warn
          retention-days: 14

  public-sample-audit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.test.txt
      - name: Install audit dependencies
        run: python -m pip install -r backend/requirements.test.txt
      - name: Audit public no-login sample
        shell: pwsh
        run: |
          ./scripts/audit-real-site.ps1 `
            "https://samplelib.com/sample-mp4.html" `
            -TaskProbe `
            -YtdlpProbe `
            -RequireReady `
            -TaskTimeout 180 `
            -Browser edge
      - name: Upload redacted public audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-sample-audit-${{ github.run_id }}
          path: data/test-runs/site-audits/
          if-no-files-found: warn
          retention-days: 14
