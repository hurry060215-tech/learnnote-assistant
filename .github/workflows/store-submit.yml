name: Browser store submission

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Store provider
        required: true
        type: choice
        options: [chrome, edge]
      apply:
        description: Upload the validated draft package (requires store secrets)
        required: true
        default: false
        type: boolean
      publish:
        description: Submit the uploaded draft for review
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  submit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Package and validate extension
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.test.txt
          ./scripts/package-extension.ps1 -OutputPath "$env:RUNNER_TEMP/LearnNote-Browser-Extension.zip"
          python scripts/validate-store-package.py "$env:RUNNER_TEMP/LearnNote-Browser-Extension.zip" --version ((Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version)
      - name: Preflight or submit package
        env:
          LEARNNOTE_CHROME_ACCESS_TOKEN: ${{ secrets.LEARNNOTE_CHROME_ACCESS_TOKEN }}
          LEARNNOTE_CHROME_PUBLISHER_ID: ${{ secrets.LEARNNOTE_CHROME_PUBLISHER_ID }}
          LEARNNOTE_CHROME_ITEM_ID: ${{ secrets.LEARNNOTE_CHROME_ITEM_ID }}
          LEARNNOTE_EDGE_API_KEY: ${{ secrets.LEARNNOTE_EDGE_API_KEY }}
          LEARNNOTE_EDGE_CLIENT_ID: ${{ secrets.LEARNNOTE_EDGE_CLIENT_ID }}
          LEARNNOTE_EDGE_PRODUCT_ID: ${{ secrets.LEARNNOTE_EDGE_PRODUCT_ID }}
        shell: pwsh
        run: |
          $apply = if ('${{ inputs.apply }}' -eq 'true') { '--apply' } else { '' }
          $publish = if ('${{ inputs.publish }}' -eq 'true') { '--publish' } else { '' }
          python scripts/store-submit.py `
            --provider '${{ inputs.provider }}' `
            --package "$env:RUNNER_TEMP/LearnNote-Browser-Extension.zip" `
            $apply $publish `
            --output build/store-submit/report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: store-submit-${{ github.run_id }}
          path: build/store-submit/report.json
          if-no-files-found: warn
          retention-days: 14
